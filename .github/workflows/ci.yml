name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      FEATURE_PROJECT_CHAT: 'true'
      FEATURE_PROJECT_AI: 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galaxy_os_g00_20260914g00
          POSTGRES_USER: galaxy_g00_test
          POSTGRES_PASSWORD: g00-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U galaxy_g00_test -d galaxy_os_g00_20260914g00"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Configure isolated test environment
        run: |
          sed '/^#/d; /^$/d' scripts/g00-isolated.env.example >> "$GITHUB_ENV"
          node --env-file=scripts/g00-isolated.env.example --input-type=module -e "import {assertG00Isolation} from './apps/api/scripts/g00-isolated-environment.mjs'; assertG00Isolation()"
          mkdir -p /tmp/galaxy-os-g00-20260914g00/{files,uploads,avatars}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/document-ai/requirements-dev.txt
      - name: Install document decoder OS tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap poppler-utils python3 util-linux ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: python -m venv services/document-ai/.venv
      - run: services/document-ai/.venv/bin/pip install -r services/document-ai/requirements-dev.txt
      - run: pnpm --filter @galaxy/api prisma:generate
      - run: pnpm --filter @galaxy/api prisma:deploy
      - run: pnpm --filter @galaxy/api prisma:seed
      - run: node --test scripts/check-environment.test.mjs
      - run: pnpm env:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NODE_ENV: production
      - run: pnpm format:check
